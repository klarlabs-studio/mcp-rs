[package]
name = "klarlabs-mcp-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 AND MIT"
publish = ["crates-io"]
repository = "https://github.com/klarlabs-studio/mcp-rs"
homepage = "https://klarlabs-studio.github.io/mcp-rs/"
description = "Modern MCP protocol engine maintained by Klarlabs for mcp-rs"
readme = "README.md"
keywords = ["mcp", "model-context", "json-rpc", "async"]
categories = ["api-bindings", "asynchronous"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "UPSTREAM.md", "UPSTREAM-LICENSE", "src/**", "tests/**"]

[lib]
name = "mcp_protocol"
doctest = false

[features]
"__reqwest" = ["dep:reqwest"]
"client" = ["dep:tokio-stream"]
"client-side-sse" = ["dep:sse-stream", "dep:http", "dep:bytes", "base64"]
"elicitation" = ["dep:url"]
"reqwest" = ["__reqwest", "reqwest?/rustls"]
"schemars" = ["dep:schemars"]
"server" = ["transport-async-rw", "schemars", "dep:pastey", "uuid"]
"server-side-http" = ["uuid", "dep:rand", "dep:tokio-stream", "dep:http", "dep:http-body", "dep:http-body-util", "dep:bytes", "dep:sse-stream", "tower", "base64"]
"tower" = ["dep:tower-service"]
"transport-async-rw" = ["tokio/io-util", "tokio-util/codec"]
"transport-child-process" = ["transport-async-rw", "tokio/process", "dep:process-wrap"]
"transport-io" = ["transport-async-rw", "tokio/io-std"]
"transport-streamable-http-client" = ["client-side-sse", "transport-worker"]
"transport-streamable-http-client-reqwest" = ["transport-streamable-http-client", "__reqwest"]
"transport-streamable-http-server" = ["transport-streamable-http-server-session", "server-side-http", "transport-worker"]
"transport-streamable-http-server-session" = ["transport-async-rw", "dep:async-trait", "dep:tokio-stream"]
"transport-worker" = ["dep:tokio-stream"]
"default" = []

[dependencies]
"async-trait" = { "version" = "0.1.89", "optional" = true }
"base64" = { "version" = "0.23", "optional" = true }
"bytes" = { "version" = "1", "optional" = true }
"futures" = { "version" = "0.3" }
"http" = { "version" = "1", "optional" = true }
"http-body" = { "version" = "1", "optional" = true }
"http-body-util" = { "version" = "0.1", "optional" = true }
"indexmap" = { "version" = "2", "features" = ["serde"] }
"pastey" = { "version" = "0.2.0", "optional" = true }
"pin-project-lite" = { "version" = "0.2" }
"process-wrap" = { "version" = "10.0", "features" = ["tokio1"], "optional" = true }
"rand" = { "version" = "0.10", "optional" = true }
"reqwest" = { "version" = "0.13.2", "features" = ["json", "stream"], "optional" = true, "default-features" = false }
"schemars" = { "version" = "1.0", "features" = ["chrono04"], "optional" = true }
"serde" = { "version" = "1.0", "features" = ["derive", "rc"] }
"serde_json" = { "version" = "1.0" }
"sse-stream" = { "version" = "0.2.4", "optional" = true }
"thiserror" = { "version" = "2" }
"tokio" = { "version" = "1", "features" = ["sync", "macros", "rt", "time"] }
"tokio-stream" = { "version" = "0.1", "optional" = true }
"tokio-util" = { "version" = "0.7" }
"tower-service" = { "version" = "0.3", "optional" = true }
"tracing" = { "version" = "0.1" }
"url" = { "version" = "2.4", "optional" = true }
"uuid" = { "version" = "1", "features" = ["v4"], "optional" = true }

[target."cfg(all(target_family = \"wasm\", target_os = \"unknown\"))".dependencies]
"chrono" = { "version" = "0.4.38", "features" = ["serde", "clock", "std", "oldtime"], "default-features" = false }

[target."cfg(not(all(target_family = \"wasm\", target_os = \"unknown\")))".dependencies]
"chrono" = { "version" = "0.4.38", "features" = ["serde", "now"], "default-features" = false }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"auth\", \"auth-client-credentials-jwt\", \"auth-enterprise-managed\", \"local\", \"macros\", \"request-state\", \"reqwest-native-tls\", \"reqwest-tls-no-provider\", \"transport-streamable-http-client-unix-socket\", \"which-command\"))"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util", "test-util"] }

[[test]]
name = "modern_lifecycle"
required-features = ["client", "server"]
